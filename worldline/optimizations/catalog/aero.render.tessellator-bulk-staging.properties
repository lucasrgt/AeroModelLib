behavior.delta=Shared-pose batches whose exact model-vertex workload exceeds one Tessellator staging window write the same packed XYZ, UV, and color fields in bulk while retaining draw ordering and state; smaller batches retain ordinary vertex calls.
risks=Depends on StationAPI's Tessellator accessors and exact eight-int vertex layout; small, unsupported, or color-disabled implementations fall back to ordinary vertex calls.
rollback=Set aero.tessellatorbulk=false.
