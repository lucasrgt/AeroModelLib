behavior.delta=Shared-pose batches above the governed workload gate replay their exact transformed stream directly into the Tessellator buffer; unique rotating poses fuse the unchanged CPU transform with direct staging. Both retain packed XYZ, UV, color, draw ordering, and Tessellator.draw submission.
