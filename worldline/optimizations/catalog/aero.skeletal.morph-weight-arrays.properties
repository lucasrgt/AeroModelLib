schema=worldline.optimization.v1
id=aero.skeletal.morph-weight-arrays
summary=Store per-instance morph weights in parallel arrays for iteration-free renderer reads.
subsystem=render.morph
status=active
default.enabled=true
behavior.delta=Morph-active draws read (name, weight) pairs by index with no map iterator, Map.Entry views, or Float unboxing per draw; weight validation, zero-eviction, and NBT round-trip semantics are unchanged. getWeightsView now returns a per-call snapshot map instead of a live view.
risks=Linear name lookups assume small morph sets; storage order after a removal is swap-with-last, which only affects adapter write order, never lookups.
rollback=Restore the HashMap-backed weight storage in Aero_MorphState and the map-iteration loop in drawGroupsMorph.
tracking=annotation
