behavior.delta=Opt-in research path replaces exact curve evaluation with a contiguous 256-sample table only when load-time validation keeps position, scale/UV, and angular error within bounded tolerances; step tracks and unsafe Euler wraps retain exact sampling.
risks=Even with bounded fidelity and contiguous storage, the representative diverse-phase ULTRA workload was slower at both 64 and 256 samples; memory remains proportional to accepted clips and channels.
rollback=Leave aero.anim.lut unset or set it to false; the high-memory preset also keeps it disabled.
