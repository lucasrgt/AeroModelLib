schema=worldline.optimization.v1
id=aero.render.smooth-light-resolved-cache
summary=Cache resolved per-triangle smooth-light brightness per static instance under a bounded TTL.
subsystem=render.lighting
status=candidate
default.enabled=false
behavior.delta=With aero.smoothlight.cache=true, smooth-lit draws reuse the resolved per-triangle brightness for one (world, geometry, block position) for up to aero.smoothlight.cacheMs milliseconds (default 50) instead of resampling the world grid and re-blending every draw, so a local light change may render up to one TTL late. Unset, the draw path is unchanged.
risks=Stale brightness inside the TTL window; the LRU-bounded map (aero.smoothlight.cacheMax, default 1024) holds strong world references until eviction or clear(); single-threaded render assumption; a cache miss performs one extra resolved-array pass over the triangles.
rollback=Leave aero.smoothlight.cache unset or set it to false.
tracking=annotation
