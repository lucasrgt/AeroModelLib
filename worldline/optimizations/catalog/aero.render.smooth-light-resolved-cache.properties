schema=worldline.optimization.v1
id=aero.render.smooth-light-resolved-cache
summary=Cache resolved per-triangle smooth-light brightness per static instance under a bounded TTL.
subsystem=render.lighting
status=active
default.enabled=true
behavior.delta=Unless aero.smoothlight.cache=false, smooth-lit draws reuse the resolved per-triangle brightness for one (world, geometry, block position) for up to aero.smoothlight.cacheMs milliseconds (default 50) instead of resampling the world grid and re-blending every draw, so a local light change may render up to one TTL late. Explicit false restores the uncached draw path.
risks=Stale brightness inside the TTL window; the single-active-world cache clears on a different world identity and assumes the render thread does not interleave worlds; a cache miss performs one extra resolved-array pass over the triangles.
rollback=Set aero.smoothlight.cache=false.
tracking=annotation
