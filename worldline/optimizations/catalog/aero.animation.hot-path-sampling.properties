schema=worldline.optimization.v1
id=aero.animation.hot-path-sampling
summary=Reuse caller-owned buffers throughout animation sampling and pose composition.
subsystem=animation.sampling
status=active
default.enabled=true
behavior.delta=Render paths write channel samples and poses into persistent scratch objects instead of allocating temporary vectors per bone and channel.
risks=Static renderer scratch assumes a single render thread; reentrant evaluation or retained scratch references can corrupt poses.
rollback=Use the allocating sampleRot, samplePos, and sampleScl APIs and restore per-call pose buffers in the renderers.
tracking=annotation
