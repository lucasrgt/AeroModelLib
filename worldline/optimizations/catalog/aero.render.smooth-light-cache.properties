schema=worldline.optimization.v1
id=aero.render.smooth-light-cache
summary=Sample a model footprint lighting grid once and reuse it across triangles.
subsystem=render.lighting
status=active
default.enabled=true
behavior.delta=Smooth mesh lighting performs one world brightness lookup per XZ grid cell and bilinearly samples the grid instead of four world lookups per triangle.
risks=Large footprints grow shared scratch memory; incorrect bounds or centroid metadata can change lighting and static scratch is render-thread-only.
rollback=Restore direct world brightness queries around every triangle centroid.
tracking=annotation
