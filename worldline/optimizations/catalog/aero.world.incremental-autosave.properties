schema=worldline.optimization.v1
id=aero.world.incremental-autosave
summary=Spread non-forced single-player chunk writes across smaller fair autosave batches.
subsystem=world.persistence
status=candidate
default.enabled=false
behavior.delta=When opted in, each 40-tick non-forced autosave writes a bounded chunk batch and resumes after its last visited chunk while forced saves retain vanilla order, drain all eligible chunks, and flush storage.
risks=Dirty chunks remain crash-exposed for longer, one expensive chunk can still hitch, list-order fairness is not age or visibility prioritization, and interactions with save-management mods require qualification.
rollback=Leave aero.incrementalAutosave unset or set it to false to restore vanilla's 24-chunk non-forced batch.
tracking=annotation
